version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
    ignore:
      # Keep these explicit so the upgrade policy for the core React/web3 stack
      # stays visible even if the broader major-update rule changes later.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "wagmi"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "viem"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
